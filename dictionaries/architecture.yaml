# 建築用語の読み辞書（例）— ナレーションの合成の前に、表記を読み（カタカナ）に置き換える
#
# 既定では使わない。建築の台本で使うときは、次のどちらかで選ぶ。
#   - config/kit.yaml の voice.dictionaries: [architecture]
#   - erkit voice synth … --dictionary architecture
#
# - entries: 表記 → 読み（カタカナ）。最長一致・1 回だけ置換する（「見付け」は「見付」より優先）。
#   送り仮名つきの表記（見付け・見込み）は、短い表記と二重にならないよう別のエントリで持つ。
# - check_terms: 置換しないが `erkit voice kana` で読みを一覧に出す語。
#   既定で正しく読める見込みの語や、カタカナ語（置換しても変わらない語）はここに置く。
#   kana の結果で読み誤りが分かった語は entries へ移す。
# - 1 文字の語（庇・框・辺）は他の熟語の一部にも当たる（例: 庇護）。問題が出たら熟語側をエントリに足して
#   最長一致で逃がす。
# - アクセントの調整はテキストの置換ではできない。
# - 読みは AivisSpeech Engine の解析（kana）で確かめたもの。抑揚・間の取り方は WAV を聞いて確かめる。
version: 1
entries:
  # --- 部位・納まり
  庇: ヒサシ
  躯体: クタイ
  竪樋: タテドイ
  笠木: カサギ
  見付け: ミツケ
  見付: ミツケ
  見込み: ミコミ
  見込: ミコミ
  天端: テンバ
  巾木: ハバキ
  框: カマチ
  胴縁: ドウブチ
  野縁: ノブチ
  破風: ハフ
  # --- 建具（片開き・両開き・竪框は未実測）
  片開き: カタビラキ
  両開き: リョウビラキ
  竪框: タテガマチ
  # 端部: 原文では「ハシブ」と読まれた
  端部: タンブ
  # README: 原文では「リイドゥミイ」と読まれた
  README: リードミー

  # --- 原文では誤読だった語
  # 風量: 原文では「必要風量」が「ヒツヨオカゼリョウ」と読まれた。
  # 「必要風量」のエントリは置かない（途中で切れて読まれたため）。「必要」は原文のまま、「風量」だけを置換する
  風量: フウリョウ
  # 辺: 「各辺」→カクアタリ、「辺ごと」→アタリゴト と読まれた
  辺: ヘン
  # 「辺」の置換で崩れないよう、辺を含む熟語は最長一致で先に読みを当てる（未実測）
  辺り: アタリ
  周辺: シュウヘン
  近辺: キンペン
  一辺: イッペン
  底辺: テイヘン
  斜辺: シャヘン
  水辺: ミズベ
  海辺: ウミベ
  窓辺: マドベ
  浜辺: ハマベ
  岸辺: キシベ

check_terms:
  # 辞書から外した語（原文のままで正しく読めた、または辞書を当てると不自然になった）
  - 建具            # 原文で「タテグ」
  - 等ピッチ        # 原文で「トウピッチ」。辞書を当てると「トオピッチ」
  - 累積長          # 原文で「ルイセキチョオ」
  - 端点            # 原文で「タンテン」。辞書を当てると「タン/テン」と切れる
  # 建築・設備用語（原文のまま読めた語）
  - 意匠境界
  - 意匠上
  - 開口率
  - 有効開口率
  - 開口部
  - 換気開口
  - 通過風速
  - 換気量
  - 有効面積
  - 立面図
  - 是正措置
  - 気流
  - 鉛直軸
  - 折れ線
  - 配置点
  - 原点
  - 部材
  - 熱貫流率        # 未実測（サンプル題材で使う語）
  - 複層ガラス      # 未実測
  # カタカナ語（置換しても変わらない。アクセントの確認用）
  - ガラリ
  - アンダーカット
  - パンチングメタル
  # 数値・単位（エンジンの正規化に任せている）
  - 150ミリ
  - 毎秒2.0メートル
  - 35パーセント
  - 500mm
