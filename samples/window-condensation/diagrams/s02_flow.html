<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>s02 フロー: 結露ができるまで</title>
<link rel="stylesheet" href="../../_shared/diagram.css">
</head>
<body>
<div class="wrap">
  <div class="part-title">水滴ができるまで</div>
  <div class="flow">
    <div class="step" data-mark="step_1"><div class="num c-amber">1</div><b>暖かい空気</b><span>水蒸気を多く含める</span></div>
    <div class="to">→</div>
    <div class="step" data-mark="step_2"><div class="num c-blue">2</div><b>冷えた窓に触れる</b><span>ガラスの近くで冷える</span></div>
    <div class="to">→</div>
    <div class="step" data-mark="step_3"><div class="num c-blue">3</div><b>露点を下回る</b><span>20℃・60%なら約12℃</span></div>
    <div class="to">→</div>
    <div class="step" data-mark="step_4"><div class="num c-teal">4</div><b>水滴になる</b><span>これが結露</span></div>
  </div>
  <div class="part-note">露点: 水滴ができ始める温度（例の値は 日本サッシ協会「サッシの結露」より）</div>
</div>
</body>
</html>
