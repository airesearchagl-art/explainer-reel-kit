  <div class="cards">
    <div class="card" data-mark="card_1"><div class="badge c-blue">1</div>
      <div class="tag blue">温度の差</div><div class="t sm">部屋の中と外の温度の差</div><div class="s sm">外が寒いほど、窓は冷える</div></div>

    <div class="card" data-mark="card_3"><div class="badge c-gray">!</div>
      <div class="tag gray">窓を変えても</div><div class="t sm">複層ガラスでも起きる</div><div class="s sm">2 つの条件しだいで結露する</div></div>
  </div>
