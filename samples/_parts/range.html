<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>部品: 数値の範囲（.range）</title>
<link rel="stylesheet" href="../_shared/diagram.css">
</head>
<body>
<div class="wrap">
  <div class="part-title">数値の範囲と目安（見本の値。位置は 0〜7 の目盛りに合わせた %）</div>
  <div class="range">
    <div class="lane"><div class="lane-label">1 枚のガラス</div>
      <div class="track"><div class="band c-gray narrow" style="--l:82.9%;--w:2.9%" data-mark="band_single"><em>5.8〜6.0</em></div></div></div>
    <div class="lane"><div class="lane-label">2 枚のガラス</div>
      <div class="track"><div class="band c-blue" style="--l:38.6%;--w:18.6%" data-mark="band_double">2.7〜4.0</div></div></div>
    <div class="lane"><div class="lane-label">膜つきの 2 枚</div>
      <div class="track"><div class="band c-teal" style="--l:15.7%;--w:22.9%" data-mark="band_coated">1.1〜2.7</div></div></div>
    <div class="axis">
      <div class="target" style="left:32.9%;height:340px" data-mark="target"><b>目安（例）</b></div>
      <div class="tick" style="left:0%">0</div><div class="tick" style="left:14.29%">1</div><div class="tick" style="left:28.57%">2</div>
      <div class="tick" style="left:42.86%">3</div><div class="tick" style="left:57.14%">4</div><div class="tick" style="left:71.43%">5</div>
      <div class="tick" style="left:85.71%">6</div><div class="tick" style="left:100%">7</div>
      <div class="unit">小さいほど熱が逃げにくい</div>
    </div>
  </div>
</div>
</body>
</html>
