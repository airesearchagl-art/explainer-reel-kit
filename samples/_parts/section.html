<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>部品: 断面図（.section）</title>
<link rel="stylesheet" href="../_shared/diagram.css">
</head>
<body>
<div class="wrap">
  <div class="part-title">複層ガラスの断面（模式。厚さは実寸ではない）</div>
  <div class="section">
    <div class="side in">室内</div>
    <div class="layer c-blue thin" data-mark="layer_glass_in"><b>ガラス</b></div>
    <div class="layer c-gray" style="flex:1.4" data-mark="layer_air"><b>空気の層</b><span>熱を伝えにくい</span></div>
    <div class="layer c-amber thin" data-mark="layer_coat"><b>膜</b></div>
    <div class="layer c-blue thin"><b>ガラス</b></div>
    <div class="side out">室外</div>
  </div>
  <div class="section-caption"><span>暖かい側</span><span>層が重なるほど、熱は通りにくくなる</span><span>冷たい側</span></div>
</div>
</body>
</html>
