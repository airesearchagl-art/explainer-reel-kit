<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>部品: カード（.cards）</title>
<link rel="stylesheet" href="../_shared/diagram.css">
</head>
<body>
<div class="wrap">
  <div class="part-title">結露を減らす 3 つの方法</div>
  <div class="cards">
    <div class="card" data-mark="card_1"><div class="badge c-blue">1</div>
      <div class="tag blue">窓を変える</div><div class="t sm">冷えにくいガラスにする</div><div class="s sm">表面の温度を上げる</div></div>
    <div class="card" data-mark="card_2"><div class="badge c-teal">2</div>
      <div class="tag teal">空気を入れ替える</div><div class="t sm">換気で湿気を逃がす</div><div class="s sm">水蒸気の量を減らす</div></div>
    <div class="card" data-mark="card_3"><div class="badge c-amber">3</div>
      <div class="tag amber">湿気を出さない</div><div class="t sm">室内で干す量を控える</div><div class="s sm">加湿のしすぎに注意</div></div>
  </div>
</div>
</body>
</html>
