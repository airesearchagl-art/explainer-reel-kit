<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>部品: 条件の分岐（.branch）</title>
<link rel="stylesheet" href="../_shared/diagram.css">
</head>
<body>
<div class="wrap">
  <div class="branch">
    <div class="q" data-mark="question">窓のどこが一番困る？</div>
    <div class="stem"></div>
    <div class="paths">
      <div class="path"><div class="cond c-blue">冬の寒さ</div>
        <div class="leaf" data-mark="leaf_cold"><b>熱を逃がさない窓</b><span>断熱を優先して選ぶ</span></div></div>
      <div class="path"><div class="cond c-amber">夏の日差し</div>
        <div class="leaf" data-mark="leaf_sun"><b>日射を抑える窓</b><span>遮熱を優先して選ぶ</span></div></div>
      <div class="path"><div class="cond c-gray">どちらも</div>
        <div class="leaf" data-mark="leaf_both"><b>向きで分ける</b><span>南と北で選び方を変える</span></div></div>
    </div>
  </div>
</div>
</body>
</html>
