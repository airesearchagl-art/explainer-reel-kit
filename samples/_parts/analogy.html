<!doctype html>
<html lang="ja">
<head>

<title>部品: たとえ（.analogy）</title>
<link rel="stylesheet" href="../_shared/diagram.css">
</head>
<body>
<div class="wrap">
  <div class="analogy">
    <div class="side" data-mark="everyday"><div class="tag gray">身近なもの</div><b>冷たい飲みものの缶</b><span>夏に冷蔵庫から出すと、まわりに水滴がつく</span></div>
    <div class="eq">≒</div>
    <div class="side" data-mark="topic"><div class="tag blue">本題</div><b>冬の窓ガラス</b><span>外の寒さで冷えたガラスに、室内の水蒸気が水滴になる</span></div>
  </div>
  <div class="map" data-mark="mapping">
    <div class="l">冷たい缶の表面</div><div class="mid">↔</div><div class="r">冷えたガラスの表面</div>
    <div class="l">夏の湿った空気</div><div class="mid">↔</div><div class="r">室内の暖かい空気</div>
  </div>
</div>
