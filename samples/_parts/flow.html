<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>部品: フロー（.flow）</title>
<link rel="stylesheet" href="../_shared/diagram.css">
</head>
<body>
<div class="wrap">
  <div class="part-title">結露ができるまで</div>
  <div class="flow">
    <div class="step" data-mark="step_1"><div class="num c-amber">1</div><b>暖かい空気</b><span>水蒸気を多く含む</span></div>
    <div class="to">→</div>
    <div class="step" data-mark="step_2"><div class="num c-blue">2</div><b>冷たい面に触れる</b><span>窓ガラスで冷やされる</span></div>
    <div class="to">→</div>
    <div class="step" data-mark="step_3"><div class="num c-blue">3</div><b>持ちきれなくなる</b><span>含める水蒸気の量が減る</span></div>
    <div class="to">→</div>
    <div class="step" data-mark="step_4"><div class="num c-teal">4</div><b>水滴になる</b><span>これが結露</span></div>
  </div>
</div>
</body>
</html>
