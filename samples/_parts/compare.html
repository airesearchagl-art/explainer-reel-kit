<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>部品: 比較表（table.compare）</title>
<link rel="stylesheet" href="../_shared/diagram.css">
</head>
<body>
<div class="wrap">
  <div class="part-title">窓ガラスの比べ方（見本の値。製品で変わる）</div>
  <table class="compare">
    <thead><tr><th></th><th>熱の逃げにくさ</th><th>結露のしにくさ</th><th>価格の目安</th></tr></thead>
    <tbody>
      <tr data-mark="row_single"><th>1 枚のガラス</th><td class="weak">△</td><td class="weak">△</td><td>安い</td></tr>
      <tr data-mark="row_double"><th>2 枚のガラス</th><td>○</td><td>○</td><td>ふつう</td></tr>
      <tr class="best" data-mark="row_coated"><th>膜つきの 2 枚</th><td class="good">◎</td><td class="good">◎</td><td>やや高い</td></tr>
    </tbody>
  </table>
  <div class="part-note">◎ とても良い　○ 良い　△ ふつう（見本の評価。台本では出典のある値に置き換える）</div>
</div>
</body>
</html>
