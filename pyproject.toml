[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "explainer-reel-kit"
version = "0.1.1"
description = "台本からナレーション付きの説明動画（MP4）を作るキット"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
  # スライド: .pptx の生成と p:timing の XML 編集、画像の大きさ・確認用の一覧画像
  "python-pptx>=1.0,<2",
  "lxml>=4.9",
  "Pillow>=9",
  # 撮影・説明図（ブラウザは python -m playwright install chromium、または Edge）
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
erkit = "explainer_reel_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
explainer_reel_kit = ["data/schema/*.json", "data/templates/*.md", "export/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode lets tests/conftest.py and tests/narration/conftest.py coexist without __init__.py.
pythonpath = ["tests", "tests/deck", "tests/narration"]
addopts = "--import-mode=importlib"
