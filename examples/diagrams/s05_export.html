<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>s05 スライドから MP4 ができる流れ</title>
<link rel="stylesheet" href="../../samples/_shared/diagram.css">
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="card" data-mark="pptx">
      <div class="tag blue">スライド（.pptx）</div>
      <div class="s">アニメーション付き<br>自動で切り替わる</div>
    </div>
    <div class="arrow">→</div>
    <div class="card center" data-mark="powerpoint">
      <div class="tag gray">PowerPoint</div>
      <div class="t sm">無音の<br>MP4 に書き出す</div>
    </div>
    <div class="arrow">→</div>
    <div class="card" data-mark="mp4">
      <div class="tag teal">できあがり</div>
      <div class="s">・ナレーション付きの MP4<br>・直せる .pptx も残る</div>
    </div>
  </div>
  <div class="card center"><div class="s">最後に <span class="strong">ナレーションの音声</span> を重ねて完成</div></div>
</div>
</body>
</html>
