<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>例のページ（撮影の確認用）</title>
<style>
  body { margin: 0; font-family: "Noto Sans CJK JP", "Yu Gothic UI", "Meiryo", sans-serif; background: #f6f8fb; color: #1f2a44; }
  main { max-width: 1100px; margin: 80px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  section { background: #fff; border: 2px solid #c9d3e3; border-radius: 16px; padding: 32px; }
  h1 { grid-column: 1 / 3; font-size: 40px; margin: 0; }
  label { display: block; font-size: 22px; margin: 12px 0 6px; }
  input { font-size: 24px; width: 8em; padding: 6px 10px; }
  button { font-size: 22px; padding: 10px 24px; margin-top: 20px; }
  #result { font-size: 56px; font-weight: 700; color: #127a5e; }
</style>
</head>
<body>
<main>
  <h1>面積の計算（例のページ）</h1>
  <section data-testid="input-area">
    <label for="w">幅（m）</label><input id="w" type="number" value="1.6">
    <label for="h">高さ（m）</label><input id="h" type="number" value="2.0">
    <button data-testid="calc">計算する</button>
  </section>
  <section data-testid="result-area">
    <div style="font-size:22px">面積</div>
    <div id="result">—</div>
  </section>
</main>
<script>
  document.querySelector('[data-testid="calc"]').addEventListener('click', () => {
    const a = Number(document.getElementById('w').value) * Number(document.getElementById('h').value);
    document.getElementById('result').textContent = a.toFixed(2) + ' m²';
  });
</script>
</body>
</html>
