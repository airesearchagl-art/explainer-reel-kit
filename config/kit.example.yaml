# キットの設定のひな形。config/kit.yaml に写して使う（kit.yaml は commit しない）。
# 探す順: --config ＞ 環境変数 ERKIT_CONFIG ＞ 今のフォルダの config/kit.yaml ＞ キットのフォルダの config/kit.yaml

# 出力先のルート。空なら ユーザーのフォルダ\ExplainerReelKit\output（環境変数 ERKIT_OUTPUT_ROOT が優先）
output_root: ""

voice:
  engine: aivisspeech          # 音声合成エンジン（いまは aivisspeech）
  url: ""                      # 空ならエンジンの既定（AivisSpeech は http://127.0.0.1:10101）
  speaker: 808373280           # 既定の声: ほのか / ノーマル（ACML 1.0、クレジット任意）。erkit voice list で一覧
  dictionaries: []             # 読み辞書。既定では使わない。建築の台本なら [architecture]（dictionaries/architecture.yaml）
  credits: []                  # クレジットの表記が必要な声（下の例）。ACML 1.0 の声は書かなくてよい
  # credits:
  #   - name: 声の名前
  #     credit: 動画に出す名前（最後のスライドに「ナレーション音声: <credit>」と出る）
  #     style_ids: [123456789]   # erkit voice list で確かめた style id
